name: robots
label: Search engine robots
description: robots.txt admin management plus per-page meta robots tags. Complements the XML Sitemap set. Dropped by mage-os/product-minimal-edition.
packages:
  - mage-os/module-robots
  # The Mage-OS SEO package conflicts with this optional package. It is not a
  # dependency of the robots set itself, so replacing it would make Composer
  # treat the root project as installing a conflicting package.
  - name: mage-os/module-meta-robots-tag
    replace: false
group: Marketing & Content
