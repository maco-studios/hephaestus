name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in 14 days
            if nothing changes. If it is still relevant, leaving a comment keeps it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will be closed in 14 days
            if it is still being worked on, leaving a comment keeps it open.
          close-issue-message: Closing due to inactivity. Feel free to reopen if this is still relevant.
          close-pr-message: Closing due to inactivity. Feel free to reopen if this is still being worked on.
