name: Generated Project Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  release:
    types: [published]
  pull_request:
    paths:
      - 'resources/definitions/**'
      - 'resources/catalog/**'
      - 'src/**'
      - 'bin/hephaestus'
      - 'tests/Integration/ProjectGeneration/**'

env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache

permissions:
  contents: read

jobs:
  generated-projects:
    name: Mage-OS generated-project matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
      - uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pest tests/Integration/ProjectGeneration/GeneratedProjectMatrixTest.php
