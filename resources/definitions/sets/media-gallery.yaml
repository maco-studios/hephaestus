  - mage-os/module-media-content-cms
  - mage-os/module-media-content-synchronization
  - mage-os/module-media-content-synchronization-api
  - mage-os/module-media-content-synchronization-catalog
  - mage-os/module-media-content-synchronization-cms
  - mage-os/module-media-gallery
  - mage-os/module-media-gallery-api
  - mage-os/module-media-gallery-catalog
  - mage-os/module-media-gallery-catalog-integration
  - mage-os/module-media-gallery-catalog-ui
  - mage-os/module-media-gallery-cms-ui
  - mage-os/module-media-gallery-integration
  - mage-os/module-media-gallery-metadata
  - mage-os/module-media-gallery-metadata-api
  - name: mage-os/module-media-gallery-metadata-remote-storage
    installable: false
  - mage-os/module-media-gallery-renditions
  - mage-os/module-media-gallery-renditions-api
  - mage-os/module-media-gallery-synchronization
  - mage-os/module-media-gallery-synchronization-api
